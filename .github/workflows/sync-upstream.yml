# Keeps the fork's master level with leanprover/lean-kernel-arena: new checkers, new tests and fixes
# reach the quiet board the day they land upstream. Inert unless the repository variable QUIET_BOARD is
# "on". A conflict stops the sync and fails the run; nothing is forced.
name: Sync upstream

on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: vars.QUIET_BOARD == 'on'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Merge upstream master
        run: |
          git config user.name "quiet-board sync"
          git config user.email "quiet-board-sync@users.noreply.github.com"
          git remote add upstream https://github.com/leanprover/lean-kernel-arena.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "already level with upstream"
            exit 0
          fi
          git merge --no-edit upstream/master
          git push origin HEAD:master
