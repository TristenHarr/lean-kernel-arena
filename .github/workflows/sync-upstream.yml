# Keeps the fork's master level with leanprover/lean-kernel-arena, nightly, and starts the quiet board
# whenever upstream brought something new: new checkers and tests reach the board the day they land.
# A merge conflict stops the sync and fails the run; nothing is forced. Inert unless the repository
# variable QUIET_BOARD is "on".
name: Sync upstream

on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: vars.QUIET_BOARD == 'on'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Merge upstream master
        id: merge
        run: |
          git config user.name "quiet-board sync"
          git config user.email "quiet-board-sync@users.noreply.github.com"
          git remote add upstream https://github.com/leanprover/lean-kernel-arena.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "already level with upstream"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-edit upstream/master
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # A push made with the workflow token starts no workflow, so the board is started explicitly.
      - name: Start the quiet board
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run quiet-board.yml --ref master
